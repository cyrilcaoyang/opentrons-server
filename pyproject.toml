# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]  # Specify setuptools as the build backend
build-backend = "setuptools.build_meta"

[project]
name = "opentrons_server"                 # The distribution name on PyPI
version = "0.3.0"                         # 0.3.0: consolidate parallel files
authors = [
    { name="Yang Cao", email="cyrilcaoyang@gmail.com" },
    { name="Han Hao", email="clascclon@gmail.com" },
]
description = "A package to control Opentrons OT-2 robots via SSH, with Prefect integration."
readme = "README.md"                      # Assumes you have a README.md file
requires-python = ">=3.10,<3.13"           # opentrons-shared-data pulls numpy~=1.26.4, which has NO wheel past
                                           # cp312 — a newer interpreter tries to build it from source and fails
                                           # (no MSVC on the device PC). This upper bound is what makes `uv venv` pick
                                           # 3.12 on a fresh deploy checkout — verified; `.python-version` is
                                           # gitignored, so it cannot be relied on.
license = { text = "MIT" }                # Specify your license (e.g., MIT, Apache-2.0). Add a LICENSE file.
classifiers = [                           # Standard classifiers for PyPI
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License", # Adjust if you use a different license
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [                          # List runtime dependencies
    "sdl-lab-contract",                 # Shared STATUS_SPEC wire types (v1.2)
    "paramiko>=3.3.1",                  # SSH connectivity for robot control
    "fastapi>=0.104.1",                 # REST API framework
    "uvicorn[standard]>=0.24.0",        # ASGI server for FastAPI
    "pydantic>=2.5.0",                  # Data validation
    "requests>=2.31.0",                 # HTTP client
    "asyncssh>=2.14.0",                 # Async SSH support
    "websocket-client>=1.6.4",         # WebSocket support
    "python-multipart>=0.0.6",         # Form data parsing
    # Optional in-page chat assistant, over any OpenAI-compatible endpoint
    # (OpenRouter by default). A main dep rather than an extra so a plain
    # `uv sync --extra labware` deploy cannot silently strip it — the trap that
    # disarmed the Cytation's driver. The assistant is still OFF unless a key
    # is configured, and gateway/assistant.py imports openai defensively, so a
    # venv without it serves a healthy gateway either way.
    "openai>=1.0.0",
    "httpx>=0.25.0",  # Standalone camera service client
]

[project.optional-dependencies]
workflows = [
    "prefect>=2.14.0",
]
labware = [
    # Official Opentrons labware definitions for the gateway UI's GET /labware
    # catalog. Optional: without it the endpoint serves an empty catalog and
    # the UI's deck-declare picker falls back to its authored entries.
    "opentrons-shared-data>=8.0",
]
dev = [
    # Only for tests/ot2_agent_mcp: the agent MCP server is standalone and runs
    # in a throwaway env, never in the service venv. Dev-extra so a plain
    # `uv sync --extra labware` deploy never pulls it (it drags ~10 packages).
    "mcp>=1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

# The shared contract package is not on PyPI; pin it to the tag whose
# major.minor equals the STATUS_SPEC revision this device speaks (v1.2).
[tool.uv.sources]
sdl-lab-contract = { git = "https://github.com/AccelerationConsortium/sdl-lab-contract", tag = "v1.2.0" }

[project.urls] # Optional but recommended links
"Homepage" = "https://github.com/cyrilcaoyang/opentrons-server"
"Repository" = "https://github.com/cyrilcaoyang/opentrons-server"
"Issues" = "https://github.com/cyrilcaoyang/opentrons-server/issues"

# --- Configuration for setuptools ---
[tool.setuptools.packages.find]
where = ["src"]  # Look for packages in the 'src' directory

# Ship the prebuilt gateway UI (ui/ -> npm run build -> ui_dist/) inside the
# wheel so `pip install` delivers the /ui page without any node tooling.
[tool.setuptools.package-data]
# docs/*.md is the lab-standard Markdown agent documentation served by
# gateway/documentation.py at /agent-docs and /agent-docs/api-reference;
# it must ship inside the wheel or those routes 500 on an installed copy.
"opentrons_server" = ["ui_dist/*", "ui_dist/assets/*", "docs/*.md"]

# If you want to include non-code files (e.g., data files) within your package:
# [tool.setuptools.package-data]
# "opentrons_server" = ["*.yaml", "data/*"] # Example: include yaml files or files in a data/ subdir

# --- Tool configurations ---
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring robot connection",
]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true